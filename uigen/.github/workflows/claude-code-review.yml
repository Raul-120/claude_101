name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  code-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this pull request and provide constructive feedback. Focus on:
            - Correctness and potential bugs
            - Security issues (injections, auth, data exposure)
            - Performance concerns
            - Code clarity and maintainability
            - Adherence to existing patterns in this codebase (Next.js 15 App Router, Prisma/SQLite, Vercel AI SDK streaming)

            Be concise. Use inline comments for specific lines. Post a short summary comment with key findings.
