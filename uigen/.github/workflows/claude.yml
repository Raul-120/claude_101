name: Claude Code

# Required for issue_comment triggers and owner-triggered events
permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  # Allows you to run the workflow manually so GitHub registers it
  workflow_dispatch:

  issue_comment:
    types: [created]

  pull_request_review_comment:
    types: [created]

  pull_request_review:
    types: [submitted]

  issues:
    types: [opened]

jobs:
  claude:
    name: Claude Code Action
    runs-on: ubuntu-latest

    # Null-safe, robust trigger logic
    if: |
      (
        github.event_name == 'issue_comment' &&
        (
          contains((github.event.comment.body || ''), '@claude') ||
          contains((github.event.comment.body || ''), '@Claude') ||
          contains((github.event.comment.body || ''), '@CLAUDE')
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        (
          contains((github.event.comment.body || ''), '@claude') ||
          contains((github.event.comment.body || ''), '@Claude') ||
          contains((github.event.comment.body || ''), '@CLAUDE')
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        (
          contains((github.event.review.body || ''), '@claude') ||
          contains((github.event.review.body || ''), '@Claude') ||
          contains((github.event.review.body || ''), '@CLAUDE')
        )
      ) ||
      (
        github.event_name == 'issues' &&
        (
          contains((github.event.issue.body || ''), '@claude') ||
          contains((github.event.issue.body || ''), '@Claude') ||
          contains((github.event.issue.body || ''), '@CLAUDE')
        )
      )

    steps:
      - name: Debug Event Payload
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Actor: ${{ github.actor }}"
          echo "Comment body: ${{ github.event.comment.body }}"
          echo "Issue body: ${{ github.event.issue.body }}"
          echo "Review body: ${{ github.event.review.body }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          custom_instructions: |
            You are operating inside a GitHub Actions environment.
            Only run tools when necessary. Keep responses concise.
          allowed_tools: "Bash(*), mcp__playwright__browser_snapshot, mcp__playwright__browser_click, mcp__playwright__browser_fill, mcp__playwright__browser_launch"